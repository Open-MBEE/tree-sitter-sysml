name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated parsers are up to date
        run: |
          npm run generate
          git diff --exit-code -- kerml/src sysml/src
      - run: npm run build
      - run: npm test
      - run: npm run check-queries
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Open-MBEE/OpenSysML
          path: OpenSysML
      - name: Parse the OpenSysML standard library and examples
        run: |
          script/parse-coverage.sh OpenSysML/examples OpenSysML/internal/workspace/libs/stdlib
